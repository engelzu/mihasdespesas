<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- PWA Settings for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f9f9f9">
    <link rel="manifest" href="./manifest.json">
    <title>Minhas Despesas - Redirecionando...</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    window.location.replace('dashboard_de_despesas/code.html');
                } else {
                    window.location.replace('boas_vindas/code.html');
                }
            });
        });
    </script>
</head>
<body style="background-color: #f9f9f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="font-family: sans-serif; color: #670090;">Carregando...</p>
</body>
</html>
