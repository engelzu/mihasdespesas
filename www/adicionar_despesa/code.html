<!DOCTYPE html>

<title>Adicionar Despesa - minhasdespesas</title>
<!-- Fonts & Icons -->

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            box-shadow: 0 4px 12px rgba(129, 114, 132, 0.1);
        }
        input:focus, select:focus {
            outline: none;
            border-bottom-color: #670090 !important;
            box-shadow: 0 4px 12px rgba(103, 0, 144, 0.05);
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 z-50 w-full bg-surface dark:bg-background border-b border-outline-variant/30 flex items-center justify-between px-md pb-xs pt-[max(env(safe-area-inset-top),8px)]">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim cursor-pointer hover:bg-surface-container-low transition-colors p-xs rounded-full">menu</span>
<h1 class="font-headline-sm text-headline-sm font-bold tracking-tight text-primary dark:text-primary-fixed-dim">minhasdespesas</h1>
</div>
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim cursor-pointer hover:bg-surface-container-low transition-colors p-xs rounded-full">account_circle</span>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-[56px] mb-[72px] px-container-margin py-lg flex flex-col items-center">
<!-- Content Header -->
<div class="w-full max-w-md mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface-variant">Nova Despesa</h2>
<p class="font-body-md text-body-md text-outline">Registre seus gastos diários com rapidez.</p>
</div>
<!-- Glassmorphism Container / Form -->
<div class="w-full max-w-md bg-surface-container-lowest/80 backdrop-blur-md rounded-xl p-lg form-shadow border border-outline-variant/20">
<form class="space-y-md" id="expenseForm">
<!-- Descrição -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-outline" for="description">Descrição</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/40 rounded-t-lg px-md py-sm transition-all focus:bg-white focus:border-primary text-on-surface font-body-md outline-none focus:ring-2 focus:ring-primary/20" id="description" placeholder="Ex: Almoço no shopping" required="" type="text"/>
</div>
</div>
<!-- Valor -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-outline" for="amount">Valor (R$)</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/40 rounded-t-lg px-md py-sm transition-all focus:bg-white focus:border-primary text-on-surface font-body-lg outline-none focus:ring-2 focus:ring-primary/20" id="amount" placeholder="R$ 0,00" required="" type="text" inputmode="decimal"/>
</div>
</div>
<!-- Data -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-outline" for="date">Data</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/40 rounded-t-lg px-md py-sm transition-all focus:bg-white focus:border-primary text-on-surface font-body-md outline-none focus:ring-2 focus:ring-primary/20" id="date" required="" type="date"/>
</div>
</div>
<!-- Categoria -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-outline" for="category">Categoria</label>
<select class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/40 rounded-t-lg px-md py-sm transition-all focus:bg-white focus:border-primary text-on-surface font-body-md appearance-none outline-none focus:ring-2 focus:ring-primary/20" id="category" required="">
<option disabled="" selected="" value="">Selecione uma categoria</option>
<!-- Populated via JS -->
</select>
</div>
<!-- Forma de Pagamento -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-outline block mb-xs">Forma de Pagamento</label>
<div class="grid grid-cols-2 gap-sm">
<label class="cursor-pointer">
<input type="radio" name="payment-method" value="dinheiro" class="peer sr-only" required>
<div class="flex items-center justify-center gap-xs p-sm rounded-lg border-2 border-outline-variant/40 bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all text-on-surface-variant hover:bg-surface-container">
<span class="material-symbols-outlined text-[18px]">payments</span>
<span class="font-label-md">Dinheiro</span>
</div>
</label>
<label class="cursor-pointer">
<input type="radio" name="payment-method" value="debito" class="peer sr-only">
<div class="flex items-center justify-center gap-xs p-sm rounded-lg border-2 border-outline-variant/40 bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all text-on-surface-variant hover:bg-surface-container">
<span class="material-symbols-outlined text-[18px]">credit_card</span>
<span class="font-label-md">Débito</span>
</div>
</label>
<label class="cursor-pointer">
<input type="radio" name="payment-method" value="credito" class="peer sr-only">
<div class="flex items-center justify-center gap-xs p-sm rounded-lg border-2 border-outline-variant/40 bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all text-on-surface-variant hover:bg-surface-container">
<span class="material-symbols-outlined text-[18px]">credit_card</span>
<span class="font-label-md">Crédito</span>
</div>
</label>
<label class="cursor-pointer">
<input type="radio" name="payment-method" value="pix" class="peer sr-only">
<div class="flex items-center justify-center gap-xs p-sm rounded-lg border-2 border-outline-variant/40 bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all text-on-surface-variant hover:bg-surface-container">
<span class="material-symbols-outlined text-[18px]">pix</span>
<span class="font-label-md">Pix</span>
</div>
</label>
</div>
</div>
<!-- Info Box for Credit (Conditional) -->
<div class="hidden animate-in fade-in slide-in-from-top-2 duration-300" id="creditInfo">
<div class="bg-tertiary-fixed text-on-tertiary-fixed p-md rounded-xl flex items-start gap-sm">
<span class="material-symbols-outlined text-[20px]">info</span>
<div>
<p class="font-label-md text-label-md">Previsão de pagamento:</p>
<p class="font-body-md font-bold" id="forecastDate">--/--/----</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-sm mt-lg">
    <button type="button" onclick="navigateTo('../dashboard_de_despesas/code.html')" class="w-full bg-surface-container-high text-on-surface-variant py-md rounded-full font-headline-sm text-headline-sm shadow-md hover:bg-surface-dim transition-all active:scale-95 duration-200 flex items-center justify-center gap-xs border border-outline-variant/30">
        <span class="material-symbols-outlined">cancel</span>
        Cancelar
    </button>
    <button class="w-full bg-primary text-on-primary py-md rounded-full font-headline-sm text-headline-sm shadow-lg shadow-primary/20 hover:bg-primary-container transition-all active:scale-95 duration-200 flex items-center justify-center gap-xs" type="submit">
        <span class="material-symbols-outlined">check_circle</span>
        Salvar
    </button>
</div>
</form>
</div>
<!-- Decorative Element (Bento-style snippet) -->
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-background border-t border-outline-variant/20 rounded-t-xl flex justify-around items-center px-gutter pb-safe pt-xs">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-lowest active:scale-90 transition-all duration-300">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Início</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold hover:bg-surface-container-lowest active:scale-90 transition-all duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-md text-label-md">Adicionar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-lowest active:scale-90 transition-all duration-300">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md">Histórico</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-lowest active:scale-90 transition-all duration-300">
<span class="material-symbols-outlined">ios_share</span>
<span class="font-label-md text-label-md">Exportar</span>
</button>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            firebase.auth().onAuthStateChanged(async user => {
                if (!user) {
                    window.location.replace('../boas_vindas/code.html');
                    return;
                }

                document.getElementById('date').valueAsDate = new Date();
                
                // Populate categories dynamically
                const catSelect = document.getElementById('category');
                const categories = await getCategories();
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    catSelect.appendChild(opt);
                });

            const paymentRadios = document.querySelectorAll('input[name="payment-method"]');
            const creditInfo = document.getElementById('creditInfo');
            const dateInput = document.getElementById('date');
            const forecastDate = document.getElementById('forecastDate');


            const updateForecast = () => {
                if (dateInput.value) {
                    const selectedDate = new Date(dateInput.value);
                    // Mock calculation: Credit payment is 30 days after
                    selectedDate.setDate(selectedDate.getDate() + 30);
                    const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
                    forecastDate.textContent = selectedDate.toLocaleDateString('pt-BR', options);
                }
            };

            paymentRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'credito') {
                        creditInfo.classList.remove('hidden');
                        updateForecast();
                    } else {
                        creditInfo.classList.add('hidden');
                    }
                });
            });

            dateInput.addEventListener('change', updateForecast);

            // Micro-interaction for form submission
            const form = document.getElementById('expenseForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Salvando...';
                
                const description = document.getElementById('description').value;
                let amount = document.getElementById('amount').value;
                amount = amount.replace(',', '.');
                const date = document.getElementById('date').value;
                const paymentMethod = document.querySelector('input[name="payment-method"]:checked').value;
                let category = 'Outros';
                const catEl = document.getElementById('category');
                if (catEl) category = catEl.value;
                
                // Formata paymentMethod pra ficar bonito
                const methodMap = {
                    'dinheiro': 'Dinheiro',
                    'debito': 'Cartão de Débito',
                    'credito': 'Cartão de Crédito'
                };
                
                await addExpense({
                    description,
                    amount: parseFloat(amount),
                    date,
                    paymentMethod: methodMap[paymentMethod] || paymentMethod,
                    category
                });

                btn.innerHTML = '<span class="material-symbols-outlined">done</span> Pronto!';
                btn.classList.replace('bg-primary', 'bg-secondary');
                setTimeout(() => {
                    form.reset();
                    dateInput.valueAsDate = new Date();
                    creditInfo.classList.add('hidden');
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Salvar';
                    btn.classList.replace('bg-secondary', 'bg-primary');
                    navigateTo('../dashboard_de_despesas/code.html');
                }, 1000);
            });
            });
        });
    </script>
</body></html>
