</button>

<!-- Interactive Layer Script -->
<script>
        const input = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');
        const loginContainer = document.getElementById('loginContainer');

        function handleLogin() {
            const val = input.value;
            
            if (val === '789512') {
                // Success State
                loginContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-xl animate-bounce">
                        <div class="w-16 h-16 bg-secondary-container text-on-secondary rounded-full flex items-center justify-center mb-md">
                            <span class="material-symbols-outlined text-[40px]">check_circle</span>
                        </div>
                        <p class="font-headline-sm text-secondary">Acesso Autorizado</p>
                    </div>
                `;
                setTimeout(() => {
                    login();
                    navigateTo('../dashboard_de_despesas/code.html');
                }, 800);
            } else {
                // Error State
                input.classList.add('border-error');
                input.parentElement.parentElement.classList.add('vibrate');
                errorMsg.classList.remove('hidden');
                
                setTimeout(() => {
                    input.classList.remove('border-error');
                    input.parentElement.parentElement.classList.remove('vibrate');
                }, 300);

                // Feedback
                input.value = '';
                input.focus();
            }
        }

        // Enter key support
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // Clear error on type
        input.addEventListener('input', () => {
            errorMsg.classList.add('hidden');
        });
    </script>
