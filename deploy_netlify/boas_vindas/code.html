<div class="mb-lg text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs" id="auth-title">Boas-vindas!</h2>
<p class="font-body-md text-on-surface-variant" id="auth-subtitle">Insira seus dados para acessar sua conta.</p>
</div>
<!-- Login Form Area -->
<div class="w-full space-y-md" id="loginContainer">
<div class="relative group w-full">

<input class="w-full pl-[52px] pr-md py-md bg-surface-container-low border-b-2 border-transparent focus:border-primary outline-none transition-all font-body-lg rounded-t-lg group-hover:bg-surface-container placeholder:text-outline-variant/60" id="email" placeholder="seu@email.com" type="email"/>
</div>
</div>

<!-- Interactive Layer Script -->
<script>
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');
        const loginContainer = document.getElementById('loginContainer');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authBtn = document.getElementById('auth-btn');
        const authToggle = document.getElementById('auth-toggle');

        let isLoginMode = true;
        const forgotPassContainer = document.getElementById('forgot-password-container');

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authTitle.innerText = 'Boas-vindas!';
                authSubtitle.innerText = 'Insira seus dados para acessar sua conta.';
                authBtn.innerHTML = `Entrar <span class="material-symbols-outlined" data-weight="fill">arrow_forward</span>`;
                authToggle.innerText = 'Não tem uma conta? Cadastre-se';
                if (forgotPassContainer) forgotPassContainer.classList.remove('hidden');
            } else {
                authTitle.innerText = 'Criar Conta';
                authSubtitle.innerText = 'Preencha os dados para se registrar.';
                authBtn.innerHTML = `Cadastrar <span class="material-symbols-outlined" data-weight="fill">person_add</span>`;
                authToggle.innerText = 'Já tem uma conta? Faça login';
                if (forgotPassContainer) forgotPassContainer.classList.add('hidden');
            }
            errorMsg.classList.add('hidden');
        }

        async function handleForgotPassword() {
            const emailValue = emailInput.value || '';
            customPrompt('Digite seu e-mail para recuperar a senha:', emailValue, async (email) => {
                if (email && email.trim() !== '') {
                    try {
                        await resetPassword(email);
                        customAlert('E-mail de recuperação enviado! Verifique sua caixa de entrada.');
                    } catch (error) {
                        showError('Erro ao enviar: ' + error.message);
                    }
                }
            });
        }

        async function handleGoogleAuth() {
            try {
                await loginWithGoogle();
                showSuccess('Acesso Autorizado via Google!');
            } catch (error) {
                showError(error.message);
            }
        }

        function showSuccess(message) {
            loginContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center py-xl animate-bounce">
                    <div class="w-16 h-16 bg-secondary-container text-on-secondary rounded-full flex items-center justify-center mb-md">
                        <span class="material-symbols-outlined text-[40px]">check_circle</span>
                    </div>
                    <p class="font-headline-sm text-secondary">${message}</p>
                </div>
            `;
            setTimeout(() => {
                window.location.replace('../dashboard_de_despesas/code.html');
            }, 800);
        }

        async function handleAuth() {
            const email = emailInput.value;
            const pass = passInput.value;
            
            if (!email || !pass) {
                showError('Preencha todos os campos.');
                return;
            }

            try {
                if (isLoginMode) {
                    await loginWithEmail(email, pass);
                } else {
                    await registerWithEmail(email, pass);
                }
                
                showSuccess(isLoginMode ? 'Acesso Autorizado' : 'Conta Criada!');
            } catch (error) {
                showError(error.message);
            }
        }

        function showError(msg) {
            passInput.parentElement.parentElement.classList.add('vibrate');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
            
            setTimeout(() => {
                passInput.parentElement.parentElement.classList.remove('vibrate');
            }, 300);
        }

        passInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleAuth();
        });

        emailInput.addEventListener('input', () => errorMsg.classList.add('hidden'));
        passInput.addEventListener('input', () => errorMsg.classList.add('hidden'));
    </script>
